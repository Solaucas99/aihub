<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub de IA</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">IA</div>
        <div>
          <strong>Hub de IA</strong>
          <span>Agentes e execucoes</span>
        </div>
      </div>

      <button id="newChatButton" class="primary-action" type="button">Nova conversa</button>

      <div class="config-panel">
        <label>
          User ID
          <input id="userIdInput" autocomplete="off" spellcheck="false">
        </label>
        <label>
          API
          <input id="apiBaseInput" autocomplete="off" spellcheck="false">
        </label>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Conversas</div>
        <div id="conversationList" class="conversation-list"></div>
      </div>
    </aside>

    <main class="chat-pane">
      <header class="topbar">
        <div>
          <h1 id="conversationTitle">Nova conversa</h1>
          <p id="conversationSubtitle">Envie uma mensagem para iniciar uma conversa.</p>
        </div>
        <div id="statusBadge" class="status-badge">IDLE</div>
      </header>

      <section id="messages" class="messages"></section>

      <form id="composer" class="composer">
        <textarea id="messageInput" rows="1" placeholder="Envie uma mensagem para o Hub de IA"></textarea>
        <button id="sendButton" type="submit">Enviar</button>
      </form>
    </main>

    <aside class="agent-run-panel">
      <div class="panel-header">
        <div>
          <strong>AgentRun</strong>
          <span id="workflowIdLabel">Sem execucao ativa</span>
        </div>
        <button id="refreshButton" class="ghost-button" type="button">Atualizar</button>
      </div>

      <div class="agent-run-current">
        <span id="executionStatus">Aguardando</span>
        <p id="currentMessage">Os logs aparecerão aqui durante a execução.</p>
      </div>

      <div class="section-title">Logs</div>
      <div id="workflowLogs" class="agent-run-logs"></div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-tooltip@0.35.2/build/vega-tooltip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
